<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify Form Definitions</title></head>
<body>
  <form name="boss-get-started" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="firstName"><input name="lastName"><input name="email"><input name="phone">
    <input name="city"><input name="state"><input name="interest"><input name="organization">
    <textarea name="message"></textarea><input name="source">
  </form>

  <form name="boss-fundraising-interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="firstName"><input name="lastName"><input name="email"><input name="phone">
    <input name="role"><input name="organization"><input name="city"><input name="state">
    <input name="organizationType"><input name="participantCount"><input name="goalAmount">
    <input name="desiredStartDate"><textarea name="fundPurpose"></textarea>
    <input name="interests"><input name="intent"><textarea name="notes"></textarea>
    <input name="leadType"><input name="source">
  </form>

  <form name="boss-merchant-partner" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="firstName"><input name="lastName"><input name="title"><input name="phone">
    <input name="email"><input name="businessName"><input name="category"><input name="website">
    <input name="locations"><input name="city"><input name="state"><input name="reach">
    <input name="offerType"><input name="proposedOffer"><textarea name="restrictions"></textarea>
    <input name="useFrequency"><input name="interest"><input name="leadType"><input name="source">
  </form>

  <form name="boss-sales-rep-interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="firstName"><input name="lastName"><input name="email"><input name="phone">
    <input name="city"><input name="state"><input name="territory">
    <textarea name="salesBackground"></textarea><textarea name="relationships"></textarea>
    <input name="resumeLink"><textarea name="notes"></textarea><input name="leadType"><input name="source">
  </form>

  <form name="boss-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="firstName"><input name="lastName"><input name="email"><input name="phone">
    <input name="topic"><textarea name="message"></textarea><input name="leadType"><input name="source">
  </form>
</body>
</html>
